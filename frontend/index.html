<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>live-editor</title>
  </head>
  <body>
    <div id="topbar">
      <button class="top-item" id="run">RUN</button>
      <button class="top-item" id="share" onclick="copyCurrentUrl(this)">SHARE</button>
    </div>
    <div class="main-area" id="main-area">
      <!-- Mobile Tab Switcher (Only visible on small screens) -->
      <div class="mobile-tab-bar">
        <button class="mobile-tab active" data-target="editor">Editor</button>
        <button class="mobile-tab" data-target="io-box">Input/Output</button>
      </div>

      <div id="editor"></div>
      <div class="io-box" id="io-box">
        <div id="input">
          <textarea id="inputBox" name="inputBox" rows="4" cols="50"></textarea>
        </div>
        <div id="output"><p>some output!</p></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
  <script>
    async function copyCurrentUrl(button) {
      try {
        await navigator.clipboard.writeText(window.location.href);
        const originalText = button.textContent;
        button.textContent = 'Copied!';
        setTimeout(() => (button.textContent = originalText), 2000);
      } catch (err) {
        console.error('Failed to copy: ', err);
      }
    }
  </script>
</html>
